name: Source audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-hunter-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.28,<1' 'beautifulsoup4>=4.13,<5'
      - name: HTTP source audit (list + 3 details each)
        run: python scripts/audit_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit
          path: artifacts/cloud-audit/
          retention-days: 1
