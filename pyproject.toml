[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "car-hunter"
version = "0.1.0"
description = "Personal Israeli used-car scout"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "playwright>=1.50,<2",
  "beautifulsoup4>=4.13,<5",
]

[project.scripts]
car-hunter = "car_hunter.cli:main"

[tool.setuptools.packages.find]
include = ["car_hunter*"]
